[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-engineering-mcp-server"
version = "0.1.0"
description = "A study-friendly MCP server for data engineering operations."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.26.0,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
data-engineering-mcp = "data_engineering_mcp.server:main"
mcp-demo-client = "data_engineering_mcp.client_demo:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]